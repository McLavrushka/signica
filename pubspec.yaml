name: signica
description: "Signica — document signing app (test assignment)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # UI
  liquid_glass_widgets: ^0.29.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17

  # State
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  bloc_concurrency: ^0.3.0

  # Navigation
  auto_route: ^10.0.0

  # DI
  injectable: ^2.5.0
  get_it: ^8.0.0

  # Storage
  drift: ^2.28.0
  sqlite3: ^2.4.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # Documents
  file_picker: ^10.0.0
  image_picker: ^1.2.3
  cunning_document_scanner: ^2.8.0
  pdf: ^3.11.0
  pdfrx: ^2.4.7

  # Localization
  easy_localization: ^3.0.8

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.7.1
  drift_dev: ^2.28.0
  injectable_generator: ^2.7.0
  auto_route_generator: ^10.0.0

  bloc_test: ^10.0.0
  mocktail: ^1.0.5

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/icons/
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
